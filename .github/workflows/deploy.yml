name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  check-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Kör lint
        working-directory: ./frontend
        run: npm run lint

      - name: Bygg frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    needs: check-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy till EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/docker-bank
            git pull
            sudo docker compose down
            sudo docker compose up --build -d
